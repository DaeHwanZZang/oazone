<!--/script_scroll(1)/-->
<div id="wrap">
    <!--/include_header(1)/-->
    <div id="contentWrapper">
        <div id="contentWrap">
            <!--/include_menu(1)/-->
            <div id="content">
                <div id="review">

                    <div class="oaz-page-hd">
                        <h2 class="oaz-page-title">상품 후기</h2>
                    </div>

                    <!-- 검색 폼 -->
                    <div class="oaz-review-search">
                        <!--/form_search_review/-->
                        <fieldset>
                            <legend class="blind">사용후기 검색 폼</legend>
                            <div class="oaz-rv-search-row">
                                <label>분류 검색</label>
                                <div class="oaz-rv-selects">
                                    <!--/select_cate1/-->
                                    <!--/select_cate2/-->
                                    <!--/select_cate3/-->
                                    <!--/select_product/-->
                                </div>
                            </div>
                            <div class="oaz-rv-search-row">
                                <label>상품명 검색</label>
                                <div class="oaz-rv-selects">
                                    <!--/input_product_name(oaz-rv-input)/-->
                                    <a href="<!--/link_search/-->" class="oaz-rv-search-btn">검색</a>
                                </div>
                            </div>
                        </fieldset>
                        <!--/end_form/-->
                    </div>

                    <!-- 리뷰 목록 -->
                    <div class="oaz-review-table">
                        <div class="oaz-rv-thead">
                            <span class="oaz-rv-col-img">이미지</span>
                            <span class="oaz-rv-col-main">상품명 / 후기 내용</span>
                            <span class="oaz-rv-col-writer">작성자 / 평점</span>
                            <span class="oaz-rv-col-date">등록일</span>
                        </div>

                        <!-- 공지사항 -->
                        <!--/if_notice/-->
                        <!--/loop_notice/-->
                        <div class="oaz-rv-row oaz-rv-notice">
                            <span class="oaz-rv-col-img"><span class="oaz-rv-notice-badge">공지</span></span>
                            <span class="oaz-rv-col-main"><strong><!--/notice@content/--></strong></span>
                            <span class="oaz-rv-col-writer">관리자</span>
                            <span class="oaz-rv-col-date"><!--/notice@date_write/--></span>
                        </div>
                        <!--/end_loop/-->
                        <!--/end_if/-->

                        <!-- 리뷰 루프 -->
                        <!--/if_review/-->
                        <!--/loop_review/-->
                        <div class="oaz-rv-row" id="<!--/review@link_target/-->">
                            <span class="oaz-rv-col-img">
                                <!--/if_review@product_image_s/-->
                                <a href="<!--/review@link_product/-->">
                                    <img src="<!--/review@product_image_s/-->" width="60" height="60" alt="상품 이미지" />
                                </a>
                                <!--/else/-->
                                <img src="/images/common/noimage.gif" width="60" height="60" alt="" />
                                <!--/end_if/-->
                            </span>
                            <span class="oaz-rv-col-main">
                                <p class="oaz-rv-prd-name">
                                    <a href="<!--/review@link_product/-->"><!--/review@product_name(80)/--></a>
                                </p>
                                <p class="oaz-rv-subject">
                                    <!--/if_review@link/-->
                                    <a href="<!--/review@link/-->"><!--/review@subject(60)/--></a>
                                    <!--/else/-->
                                    <!--/review@subject(60)/-->
                                    <!--/end_if/-->
                                    <!--/if_review@attach_icon/--><img src="<!--/review@attach_icon/-->" alt="첨부" /><!--/end_if/-->
                                    <!--/if_review@reply/--><span class="oaz-rv-reply-badge">답변</span><!--/end_if/-->
                                </p>
                                <p class="oaz-rv-actions">
                                    <!--/if_review@link_modify/-->
                                    <a href="<!--/review@link_modify/-->" class="oaz-rv-btn">수정</a>
                                    <!--/end_if/-->
                                    <!--/if_review@link_delete/-->
                                    <a href="<!--/review@link_delete/-->" class="oaz-rv-btn">삭제</a>
                                    <!--/end_if/-->
                                </p>
                            </span>
                            <span class="oaz-rv-col-writer">
                                <span class="oaz-rv-writer"><!--/if_review@group_icon/--><img src="<!--/review@group_icon/-->" alt="" /><!--/end_if/--><!--/review@writer/--></span>
                                <span class="oaz-rv-score"><!--/loop_review@score/--><!--/review@score@icon/--><!--/end_loop/--></span>
                            </span>
                            <span class="oaz-rv-col-date"><!--/review@date_write/--></span>
                        </div>
                        <!-- 펼쳐지는 내용 -->
                        <div class="oaz-rv-content" id="review<!--/idx/-->" style="display:none">
                            <!--/if_review@attach_image/-->
                            <img src="<!--/review@attach_image/-->" alt="첨부 이미지" class="oaz-rv-attach" />
                            <!--/end_if/-->
                            <div class="oaz-rv-body"><!--/review@content/--></div>
                            <!--/if_review@reply/-->
                            <div class="oaz-rv-reply">
                                <span class="oaz-rv-reply-icon">&#8627;</span>
                                <!--/review@reply/-->
                            </div>
                            <!--/end_if/-->
                        </div>
                        <!--/end_loop/-->
                        <!--/end_if/-->
                    </div><!-- .oaz-review-table -->

                    <!-- 페이징 -->
                    <ol class="paging">
                        <!--/if_pager_review::first@link/-->
                        <li class="first"><a href="<!--/pager_review::first@link/-->">&laquo;</a></li>
                        <!--/end_if/-->
                        <!--/if_pager_review::prev@link/-->
                        <li class="prev"><a href="<!--/pager_review::prev@link/-->">&lsaquo;</a></li>
                        <!--/end_if/-->
                        <!--/loop_pager_review::page/-->
                            <!--/if_pager_review::page@current/-->
                        <li class="now"><a href="<!--/pager_review::current@link/-->"><!--/pager_review::current/--></a></li>
                            <!--/else/-->
                        <li><a href="<!--/pager_review::page@link/-->"><!--/pager_review::page/--></a></li>
                            <!--/end_if/-->
                        <!--/end_loop/-->
                        <!--/if_pager_review::next@link/-->
                        <li class="next"><a href="<!--/pager_review::next@link/-->">&rsaquo;</a></li>
                        <!--/end_if/-->
                        <!--/if_pager_review::last@link/-->
                        <li class="last"><a href="<!--/pager_review::last@link/-->">&raquo;</a></li>
                        <!--/end_if/-->
                    </ol>

                    <p class="oaz-rv-foot-msg">최근 10,000개 까지 등록된 상품 사용후기를 확인하실 수 있습니다.</p>

                </div><!-- #review -->
            </div><!-- #content -->
        </div><!-- #contentWrap -->
    </div><!-- #contentWrapper -->
    <hr />
    <!--/include_footer(1)/-->
</div><!-- #wrap -->
