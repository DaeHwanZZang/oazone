                            <dl class="sort">
                                <dt class="blind">검색결과 정렬</dt>
                                <dd>
                                    <ul>
                                        <li><a href="<!--/link_sort_date/-->">신상품</a></li>

                                        <li><a href="<!--/link_sort_price_up/-->">낮은금액</a></li>
                                        <li><a href="<!--/link_sort_product_name/-->">상품명</a></li>

                                </dd>
                            </dl>

                                                          <!--/number/product@price_discount/-->원</dd>
                                                        <!--/else/-->

                                                          <!--/else/-->

                                                          <!--/end_if/-->
                                                        <!--/end_if/-->
                                                    <!--/end_if/-->

                                <!--/end_if/-->

                                <!--/end_if/-->
                                <!--/loop_pager_product::page/-->

                                    <!--/else/-->

                                    <!--/end_if/-->
