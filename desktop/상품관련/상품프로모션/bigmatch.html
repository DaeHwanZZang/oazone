<div id="wrap">
    <!--/include_header(1)/-->
    <div id="contentWrapper">
        <div id="contentWrap">
            <!--/include_menu(1)/-->
            <div id="content">
                <div id="bigMatch">

                    <div class="oaz-page-hd">
                        <h2 class="oaz-page-title"><strong>빅매치</strong> 이벤트</h2>
                    </div>

                    <!--/form_bigmatch/-->
                    <!-- 이벤트 선택 -->
                    <div class="oaz-bm-sel"><!--/select_bigmatch_list/--></div>

                    <div class="oaz-bm-wrap">
                        <!-- 메인 비주얼 -->
                        <!--/if_bigmatch_main_image/-->
                        <div class="oaz-bm-visual"><img src="<!--/bigmatch_main_image/-->" alt="" /></div>
                        <!--/end_if/-->

                        <!-- 설명 -->
                        <div class="oaz-bm-desc">
                            <h3 class="oaz-bm-subject"><!--/bigmatch_subject/--></h3>
                            <p class="oaz-bm-content"><!--/bigmatch_content/--></p>
                        </div>

                        <!-- VS 상품 -->
                        <div class="oaz-bm-vs">
                            <div class="oaz-bm-vs-item">
                                <div class="oaz-bm-vs-thumb">
                                    <img src="<!--/bigmatch_prod_image_1/-->" alt="상품 1" />
                                </div>
                                <h4 class="oaz-bm-vs-name"><!--/bigmatch_prod_name_1/--></h4>
                                <p class="oaz-bm-vs-desc"><!--/bigmatch_prod_desc_1/--></p>
                                <a href="<!--/link_bigmatch_prod_detail_1/-->" class="oaz-bm-vs-link">바로가기 →</a>
                            </div>
                            <div class="oaz-bm-vs-divider">VS</div>
                            <div class="oaz-bm-vs-item">
                                <div class="oaz-bm-vs-thumb">
                                    <img src="<!--/bigmatch_prod_image_2/-->" alt="상품 2" />
                                </div>
                                <h4 class="oaz-bm-vs-name"><!--/bigmatch_prod_name_2/--></h4>
                                <p class="oaz-bm-vs-desc"><!--/bigmatch_prod_desc_2/--></p>
                                <a href="<!--/link_bigmatch_prod_detail_2/-->" class="oaz-bm-vs-link">바로가기 →</a>
                            </div>
                        </div>

                        <!-- 그래프 -->
                        <div class="oaz-bm-graph">
                            <div class="oaz-bm-graph-l" style="width:<!--/bigmatch_recmd_percent_1/-->%"></div>
                            <div class="oaz-bm-graph-r" style="width:<!--/bigmatch_recmd_percent_2/-->%"></div>
                        </div>

                        <!-- 퍼센트 + 선택 -->
                        <div class="oaz-bm-percent">
                            <div class="oaz-bm-pct-l">
                                <span class="oaz-bm-pct-num"><!--/bigmatch_recmd_1/-->%</span>
                                <label class="oaz-bm-pct-lbl"><!--/radio_bigmatch_prod_1/-->1번 상품</label>
                            </div>
                            <div class="oaz-bm-pct-c">
                                현재 <strong><!--/bigmatch_total_count/-->명</strong> 참여
                            </div>
                            <div class="oaz-bm-pct-r">
                                <span class="oaz-bm-pct-num"><!--/bigmatch_recmd_2/-->%</span>
                                <label class="oaz-bm-pct-lbl"><!--/radio_bigmatch_prod_2/-->2번 상품</label>
                            </div>
                        </div>

                        <!-- 댓글 작성 -->
                        <div class="oaz-bm-write">
                            <!--/if_not_login/-->
                            <div class="oaz-bm-write-row">
                                <label>이름</label><!--/input_bigmatch_writer/-->
                            </div>
                            <div class="oaz-bm-write-row">
                                <label>비밀번호</label><!--/input_bigmatch_password/-->
                            </div>
                            <!--/end_if/-->
                            <!--/text_bigmatch_content/-->
                        </div>
                    <!--/end_form/-->
                        <div class="oaz-bm-submit">
                            <a href="<!--/link_bigmatch_recmd/-->" class="oaz-bm-submit-btn">추천하기</a>
                        </div>

                        <!-- 댓글 목록 -->
                        <div class="oaz-bm-comments">
                            <div class="oaz-bm-comment-col">
                                <h4 class="oaz-bm-comment-hd">1번 상품 추천</h4>
                                <div class="oaz-bm-comment-list">
                                    <!--/if_bigmatch_comment_1/-->
                                    <!--/loop_bigmatch_comment_1/-->
                                    <dl class="oaz-bm-comment">
                                        <dt><strong><!--/bigmatch_comment_1@writer/--></strong><span><!--/bigmatch_comment_1@date/--></span><a href="<!--/bigmatch_comment_1@link_delete/-->">삭제</a></dt>
                                        <dd><!--/bigmatch_comment_1@content/--></dd>
                                    </dl>
                                    <!--/end_loop/-->
                                    <!--/else/-->
                                    <p class="oaz-bm-no-comment">추천 목록이 없습니다.</p>
                                    <!--/end_if/-->
                                </div>
                                <ol class="paging">
                                    <!--/if_pager_bigmatch_comment_1::prev/-->
                                    <li class="prev"><a href="<!--/pager_bigmatch_comment_1::prev@link/-->">&lsaquo;</a></li>
                                    <!--/end_if/-->
                                    <!--/if_bigmatch_comment_1/-->
                                    <!--/loop_pager_bigmatch_comment_1::page/-->
                                        <!--/if_pager_bigmatch_comment_1::page@current/-->
                                    <li class="now"><strong><!--/pager_bigmatch_comment_1::page/--></strong></li>
                                        <!--/else/-->
                                    <li><a href="<!--/pager_bigmatch_comment_1::page@link/-->"><!--/pager_bigmatch_comment_1::page/--></a></li>
                                        <!--/end_if/-->
                                    <!--/end_loop/-->
                                    <!--/end_if/-->
                                    <!--/if_pager_bigmatch_comment_1::next/-->
                                    <li class="next"><a href="<!--/pager_bigmatch_comment_1::next@link/-->">&rsaquo;</a></li>
                                    <!--/end_if/-->
                                </ol>
                            </div>
                            <div class="oaz-bm-comment-col">
                                <h4 class="oaz-bm-comment-hd">2번 상품 추천</h4>
                                <div class="oaz-bm-comment-list">
                                    <!--/if_bigmatch_comment_2/-->
                                    <!--/loop_bigmatch_comment_2/-->
                                    <dl class="oaz-bm-comment">
                                        <dt><strong><!--/bigmatch_comment_2@writer/--></strong><span><!--/bigmatch_comment_2@date/--></span><a href="<!--/bigmatch_comment_2@link_delete/-->">삭제</a></dt>
                                        <dd><!--/bigmatch_comment_2@content/--></dd>
                                    </dl>
                                    <!--/end_loop/-->
                                    <!--/else/-->
                                    <p class="oaz-bm-no-comment">추천 목록이 없습니다.</p>
                                    <!--/end_if/-->
                                </div>
                                <ol class="paging">
                                    <!--/if_pager_bigmatch_comment_2::prev/-->
                                    <li class="prev"><a href="<!--/pager_bigmatch_comment_2::prev@link/-->">&lsaquo;</a></li>
                                    <!--/end_if/-->
                                    <!--/if_bigmatch_comment_2/-->
                                    <!--/loop_pager_bigmatch_comment_2::page/-->
                                        <!--/if_pager_bigmatch_comment_2::page@current/-->
                                    <li class="now"><strong><!--/pager_bigmatch_comment_2::page/--></strong></li>
                                        <!--/else/-->
                                    <li><a href="<!--/pager_bigmatch_comment_2::page@link/-->"><!--/pager_bigmatch_comment_2::page/--></a></li>
                                        <!--/end_if/-->
                                    <!--/end_loop/-->
                                    <!--/end_if/-->
                                    <!--/if_pager_bigmatch_comment_2::next/-->
                                    <li class="next"><a href="<!--/pager_bigmatch_comment_2::next@link/-->">&rsaquo;</a></li>
                                    <!--/end_if/-->
                                </ol>
                            </div>
                        </div>
                    </div><!-- .oaz-bm-wrap -->

                </div><!-- #bigMatch -->
            </div><!-- #content -->
        </div><!-- #contentWrap -->
    </div><!-- #contentWrapper -->
    <hr />
    <!--/include_footer(1)/-->
</div><!-- #wrap -->
