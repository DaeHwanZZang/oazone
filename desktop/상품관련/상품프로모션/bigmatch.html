<div id="wrap">

                                    <p class="dsc"><!--/bigmatch_prod_desc_1/--></p>

                                <div class="p-c">

                                    <!--/bigmatch_recmd_2/--><img src="/images/d3/modern_simple/img_bmatch_percent.gif" alt="" />

                                <div class="list-r">
                                    <div class="cnt">
<!--/if_bigmatch_comment_2/-->
    <!--/loop_bigmatch_comment_2/-->
                                        <dl>
                                            <dt>
                                                <strong><!--/bigmatch_comment_2@writer/--></strong><!--/bigmatch_comment_2@date/-->

    <!--/end_loop/-->

<!--/end_if/-->

<!--/if_bigmatch_comment_2/-->
    <!--/loop_pager_bigmatch_comment_2::page/-->

<!--/end_if/-->
