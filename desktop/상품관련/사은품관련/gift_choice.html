<!--/script_scroll(1)/-->
<div id="wrap">
    <!--/include_header(1)/-->
    <div id="contentWrapper">
        <div id="contentWrap">
            <!--/include_menu(1)/-->
            <div id="content">
                <div id="gifSelect">

                    <div class="oaz-page-hd">
                        <h2 class="oaz-page-title"><strong>사은품</strong> 선택</h2>
                    </div>

                    <!--/if_multiple/-->
                    <!-- 다중 사은품 선택 -->
                    <div class="oaz-gift-point-bar">
                        선택 가능한 사은 포인트 <strong><!--/user_point(basic_price_style)/-->점</strong>
                    </div>
                    <!--/if_gift/-->
                    <div class="oaz-gift-grid">
                        <!--/loop_gift/-->
                        <!--/gift@form/-->
                        <div class="oaz-gift-card">
                            <div class="oaz-gift-thumb">
                                <!--/if_gift@image/-->
                                <img src="<!--/gift@image/-->" alt="<!--/gift@name/-->" />
                                <!--/else/-->
                                <div class="oaz-gift-no-img">사진 없음</div>
                                <!--/end_if/-->
                            </div>
                            <div class="oaz-gift-info">
                                <h3 class="oaz-gift-name"><!--/gift@name/--><em class="oaz-gift-pts">(<!--/number/gift@point/-->점)</em></h3>
                                <!--/loop_gift@option/-->
                                <!--/if_gift@option@title/-->
                                <p class="oaz-gift-opt"><!--/gift@option@title/--> : <!--/gift@option@select/--></p>
                                <!--/end_if/-->
                                <!--/end_loop/-->
                                <!--/if_gift@price_end/-->
                                <p class="oaz-gift-cond"><!--/number/gift@price_start/-->원 이상 <!--/number/gift@price_end/-->원 이하 구매 시</p>
                                <!--/end_if/-->
                                <div class="oaz-gift-choose">
                                    <label class="oaz-gift-chk"><!--/gift@checkbox_choice/--> 선택</label>
                                    <label class="oaz-gift-cnt">수량 : <!--/gift@select_count/--></label>
                                </div>
                            </div>
                        </div>
                        <!--/end_form/-->
                        <!--/end_loop/-->
                    </div>
                    <div class="oaz-gift-submit">
                        <a href="<!--/link_choice/-->" class="oaz-gift-submit-btn">선택하기</a>
                    </div>
                    <!--/end_if/-->
                    <!--/else/-->
                    <!-- 단일 사은품 선택 -->
                    <!--/if_gift/-->
                    <div class="oaz-gift-grid">
                        <!--/loop_gift/-->
                        <!--/gift@form/-->
                        <div class="oaz-gift-card">
                            <div class="oaz-gift-thumb">
                                <!--/if_gift@image/-->
                                <img src="<!--/gift@image/-->" alt="<!--/gift@name/-->" />
                                <!--/else/-->
                                <div class="oaz-gift-no-img">사진 없음</div>
                                <!--/end_if/-->
                            </div>
                            <div class="oaz-gift-info">
                                <h3 class="oaz-gift-name"><!--/gift@name/--></h3>
                                <!--/loop_gift@option/-->
                                <!--/if_gift@option@title/-->
                                <p class="oaz-gift-opt"><!--/gift@option@title/--> : <!--/gift@option@select/--></p>
                                <!--/end_if/-->
                                <!--/end_loop/-->
                                <!--/if_gift@price_end/-->
                                <p class="oaz-gift-cond"><!--/number/gift@price_start/-->원 이상 <!--/number/gift@price_end/-->원 이하 구매 시</p>
                                <!--/end_if/-->
                                <div class="oaz-gift-submit">
                                    <a href="<!--/gift@link_choice/-->" class="oaz-gift-submit-btn">선택하기</a>
                                </div>
                            </div>
                        </div>
                        <!--/end_form/-->
                        <!--/end_loop/-->
                    </div>
                    <!--/end_if/-->
                    <!--/end_if/-->

                </div><!-- #gifSelect -->
                <!--/include_footer(1)/-->
            </div><!-- #content -->
        </div><!-- #contentWrap -->
    </div><!-- #contentWrapper -->
</div><!-- #wrap -->
