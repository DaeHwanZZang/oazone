<div id="wrap">
    <!--/include_header(1)/-->
    <div id="contentWrapper">
        <div id="contentWrap">
            <!--/include_menu(1)/-->
            <div id="content">
                <div id="productClass">

                    <!-- 브랜드 헤더 -->
                    <div class="oaz-brand-hd">
                        <h2 class="oaz-brand-nm"><!--/brand_name/--></h2>
                        <div class="oaz-brand-sel">
                            <!--/select_brand_list/-->
                            <a href="<!--/link_select_brand/-->" class="oaz-brand-sel-btn">이동</a>
                        </div>
                    </div>

                    <!--/if_brand_banner/-->
                    <div class="oaz-brand-banner"><!--/brand_banner/--></div>
                    <!--/end_if/-->

                    <!-- 추천 상품 -->
                    <!--/if_promotion_product/-->
                    <div class="oaz-main-section">
                        <div class="oaz-section-hd">
                            <h3 class="oaz-section-title"><strong>추천</strong> 상품</h3>
                        </div>
                        <div class="oaz-prd-grid oaz-prd-grid-3">
                            <!--/loop_promotion_product(3)/-->
                            <div class="oaz-prd-card">
                                <a href="<!--/promotion_product@link/-->" class="oaz-prd-img-wrap">
                                    <img src="<!--/promotion_product@image_s/-->" alt="<!--/promotion_product@name(30)/-->" />
                                </a>
                                <div class="oaz-prd-info">
                                    <!--/if_promotion_product@color/-->
                                    <p class="oaz-prd-colors"><!--/loop_promotion_product@color/--><span style="color:<!--/promotion_product@color@code/-->">■</span><!--/end_loop/--></p>
                                    <!--/end_if/-->
                                    <p class="oaz-prd-icons"><!--/promotion_product@icons/--></p>
                                    <p class="oaz-prd-name">
                                        <a href="<!--/promotion_product@link/-->"><!--/promotion_product@name(60)/--></a>
                                        <!--/promotion_product@btn_option_preview/-->
                                    </p>
                                    <p class="oaz-prd-price">
                                        <strong class="oaz-price-sell"><!--/number/promotion_product@price_sell/-->원</strong>
                                    </p>
                                </div>
                            </div>
                            <!--/end_loop/-->
                        </div>
                    </div>
                    <!--/end_if/-->

                    <!-- 정렬 바 -->
                    <div class="oaz-sort-bar">
                        <p class="oaz-sort-total">총 <strong><!--/pager_product::count/--></strong>개 상품</p>
                        <div class="oaz-sort-links-plain">
                            <a href="<!--/link_sort_date/-->">최신순</a>
                            <a href="<!--/link_sort_price_down/-->">높은가격</a>
                            <a href="<!--/link_sort_price_up/-->">낮은가격</a>
                            <a href="<!--/link_sort_product_name/-->">상품명</a>
                            <a href="<!--/link_sort_view_count/-->">인기순</a>
                        </div>
                    </div>

                    <!-- 상품 그리드 -->
                    <!--/if_product/-->
                    <div class="oaz-prd-grid oaz-prd-grid-3">
                        <!--/loop_product/-->
                        <div class="oaz-prd-card">
                            <a href="<!--/product@link/-->" class="oaz-prd-img-wrap">
                                <img src="<!--/product@image_m/-->" alt="<!--/product@name(30)/-->" />
                            </a>
                            <div class="oaz-prd-info">
                                <!--/if_product@color/-->
                                <p class="oaz-prd-colors"><!--/loop_product@color/--><span style="color:<!--/product@color@code/-->">■</span><!--/end_loop/--></p>
                                <!--/end_if/-->
                                <p class="oaz-prd-icons"><!--/product@icons/--></p>
                                <p class="oaz-prd-name">
                                    <a href="<!--/product@link/-->"><!--/product@name(60)/--></a>
                                    <!--/product@btn_option_preview/-->
                                </p>
                                <p class="oaz-prd-price">
                                    <strong class="oaz-price-sell"><!--/number/product@price_sell/-->원</strong>
                                </p>
                            </div>
                        </div>
                        <!--/end_loop/-->
                    </div>

                    <!-- 페이징 -->
                    <ol class="paging">
                        <!--/if_pager_product::first@link/-->
                        <li class="first"><a href="<!--/pager_product::first@link/-->">&laquo;</a></li>
                        <!--/end_if/-->
                        <!--/if_pager_product::prev@link/-->
                        <li class="prev"><a href="<!--/pager_product::prev@link/-->">&lsaquo;</a></li>
                        <!--/end_if/-->
                        <!--/loop_pager_product::page/-->
                            <!--/if_pager_product::page@current/-->
                        <li class="now"><a href="<!--/pager_product::current@link/-->"><!--/pager_product::current/--></a></li>
                            <!--/else/-->
                        <li><a href="<!--/pager_product::page@link/-->"><!--/pager_product::page/--></a></li>
                            <!--/end_if/-->
                        <!--/end_loop/-->
                        <!--/if_pager_product::next@link/-->
                        <li class="next"><a href="<!--/pager_product::next@link/-->">&rsaquo;</a></li>
                        <!--/end_if/-->
                        <!--/if_pager_product::last@link/-->
                        <li class="last"><a href="<!--/pager_product::last@link/-->">&raquo;</a></li>
                        <!--/end_if/-->
                    </ol>
                    <!--/end_if/-->

                </div><!-- #productClass -->
