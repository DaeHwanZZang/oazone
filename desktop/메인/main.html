<script>
$(function() {
    var $slider = $('#bestSlider');
    var $viewport = $('#bestViewport');
    var itemW = 200;
    var pos = 0;
    $('#bestNext').on('click', function() {
        var maxPos = $slider.width() - $viewport.width();
        pos = Math.min(pos + itemW * 3, maxPos);
        $slider.css('transform', 'translateX(-' + pos + 'px)');
    });
    $('#bestPrev').on('click', function() {
        pos = Math.max(pos - itemW * 3, 0);
        $slider.css('transform', 'translateX(-' + pos + 'px)');
    });
});
</script>
