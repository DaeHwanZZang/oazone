<script>
$(function() {
    // 댓글 보기
    $('#all-review .all-list .sub .link-view a').on('click', function(e) {
        e.preventDefault();
        $(this).parents('li:first').find('.re-wrap').toggle();
    });
    $('#review-list .reviews h4 a').on('click', function(e) {
        e.preventDefault();
        $(this).parents('li:first').toggleClass('now');
    });
});
</script>
